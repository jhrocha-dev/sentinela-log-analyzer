[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinela-log-analyzer"
version = "0.1.0"
description = "Analisador offline de eventos de autenticação para estudos de Blue Team"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "José Henrique Rocha" }]
dependencies = []

[project.scripts]
sentinela = "sentinela.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
